<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" fill="none">
  <defs>
    <linearGradient id="sky" x1="300" y1="0" x2="300" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="65%" stop-color="#222938"/>
      <stop offset="100%" stop-color="#353944"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="180" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFE7DA"/>
      <stop offset="100%" stop-color="#D4C3AB"/>
    </linearGradient>
    <radialGradient id="lamp1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE7AE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE7AE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="560" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="120" cy="70" r="2" fill="#FFF7DE" opacity="0.7"/>
  <circle cx="460" cy="95" r="2.2" fill="#FFF7DE" opacity="0.75"/>
  <circle cx="290" cy="48" r="1.6" fill="#FFF7DE" opacity="0.6"/>
  <!-- Luxury boutique hotel facade -->
  <rect x="52" y="182" width="496" height="248" rx="6" fill="url(#facade)"/>
  <rect x="330" y="218" width="230" height="26" fill="#FAF4E8"/>
  <!-- Columns -->
  <rect x="366" y="244" width="26" height="186" fill="#F7EFE2"/>
  <rect x="492" y="244" width="26" height="186" fill="#F7EFE2"/>
  <!-- Warm architectural uplights -->
  <circle cx="122" cy="275" r="46" fill="url(#lamp1)"/>
  <circle cx="235" cy="275" r="46" fill="url(#lamp1)"/>
  <circle cx="442" cy="270" r="64" fill="url(#lamp1)"/>
  <!-- Grand entrance glass -->
  <rect x="396" y="294" width="92" height="136" rx="4" fill="#E9C77B" opacity="0.8"/>
  <rect x="404" y="302" width="36" height="128" fill="#FFF4D1" opacity="0.75"/>
  <rect x="444" y="302" width="36" height="128" fill="#FFF4D1" opacity="0.75"/>
  <!-- Courtyard driveway -->
  <rect y="430" width="600" height="130" fill="#2A2B31"/>
  <path d="M50 430 L550 430 L600 560 L0 560 Z" fill="#37353B"/>
  <!-- Garden shrubs -->
  <ellipse cx="140" cy="432" rx="75" ry="22" fill="#253629"/>
  <ellipse cx="275" cy="432" rx="65" ry="18" fill="#2E4232"/>
